name: Adicionar proteção ao painel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  protect:
    if: "!contains(github.event.head_commit.message, 'Protege painel com login')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir autenticação no painel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('preview/admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script type="module" src="./admin.js"></script>'
          auth = '<script type="module" src="./admin-auth.js"></script>'
          if auth not in s:
              if marker not in s:
                  raise SystemExit('script admin.js não encontrado')
              s = s.replace(marker, auth + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Protege painel com login"
          git push
