name: Corrigir botão WhatsApp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar correção cirúrgica
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path('preview/preview.js')
          text = js.read_text(encoding='utf-8')
          marker = 'function sendOrder() {'
          expose = 'window.sendOrder = sendOrder;'
          if marker not in text:
              raise SystemExit('sendOrder() não encontrado')
          if expose not in text:
              text = text.replace('\nfunction openFloatingSearch() {', f'\n{expose}\n\nfunction openFloatingSearch() {{', 1)
              js.write_text(text, encoding='utf-8')

          html = Path('preview/preview.html')
          h = html.read_text(encoding='utf-8')
          old = '<script type="module" src="./preview.js?v=39"></script>'
          new = '<script type="module" src="./preview.js?v=40"></script>'
          if old in h:
              h = h.replace(old, new, 1)
              html.write_text(h, encoding='utf-8')

          print('Correção aplicada: sendOrder global + cache-buster v40')
          PY

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/preview.js preview/preview.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Corrige botão Finalizar pedido no WhatsApp"
          git push
