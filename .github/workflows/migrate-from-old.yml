name: Migrar projeto completo para o novo repositório

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar novo repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar projeto antigo temporariamente
        run: git clone --depth 1 https://github.com/SamuelFrutas/samuel-frutas.git /tmp/samuel-frutas-old

      - name: Copiar projeto completo da prévia
        run: |
          cp /tmp/samuel-frutas-old/firebase.js ./firebase.js
          rm -rf ./preview
          mkdir -p ./preview
          cp -a /tmp/samuel-frutas-old/preview/. ./preview/

      - name: Garantir entrada principal
        run: |
          cat > ./index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#0b6b3a">
            <title>Samuel Frutas — Agendamento</title>
          </head>
          <body>
            <script>window.location.replace('./preview/preview.html');</script>
            <noscript><a href="./preview/preview.html">Abrir Samuel Frutas</a></noscript>
          </body>
          </html>
          EOF

      - name: Salvar cópia completa no novo repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase.js index.html preview
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Migra projeto completo da prévia para o novo repositório"
            git push
          fi
