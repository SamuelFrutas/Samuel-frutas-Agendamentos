<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">
<title>Samuel Frutas — Prévia</title>
<link rel="stylesheet" href="./preview.css?v=75">
<link rel="stylesheet" href="./checkout-fonts.css?v=1">
</head>
<body>
<header class="top">
  <button id="home" class="brand" type="button"><span class="logo">🍃</span><span><b>Samuel Frutas</b></span></button>
  <button id="bag" class="bag" type="button" aria-label="Abrir sacola">🛒<i id="count">0</i></button>
</header>
<main>
<section id="catalog" class="view on">
  <div class="hero"><img class="hero-image" src="./assets/hero-samuel-frutas.jpg?v=3" alt="Samuel Frutas — Pedido online" width="1200" height="675" decoding="sync" fetchpriority="high"></div>
  <label class="search">⌕<input id="search" type="search" placeholder="Buscar frutas, legumes, verduras..." autocomplete="off"></label>
  <div id="load-status" class="load-status">Carregando produtos…</div>
  <div id="cats" class="cats"></div>
  <section id="products"></section>
</section>
<section id="cart" class="view">
  <div class="head"><button id="back" type="button">←</button><div><small>SUA SACOLA</small><h2>Minha Sacola</h2></div></div>
  <div id="cartlist"></div>
  <div class="checkout">
    <div class="checkout-head">🚚<div><h3>Tipo de pedido</h3><p>Escolha como deseja receber.</p></div></div>
    <div class="choices"><button id="delivery" class="choice active" type="button">🚚<b>Entrega</b><small>Receba no endereço</small></button><button id="pickup" class="choice" type="button">🏪<b>Retirada no local</b><small>Retire seu pedido</small></button></div>
    <label>📅 Data do pedido<input id="date" type="date"></label>
    <div id="addressbox"><div class="address-delivery-title">📍 Endereço de entrega</div><div class="address-mini"><input id="building" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Prédio *" aria-label="Número do prédio"><input id="block" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Bloco (opcional)" aria-label="Número do bloco"><input id="apartment" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Apartamento *" aria-label="Número do apartamento"></div></div>
    <label>📝 Observação geral<textarea id="general" placeholder="Ex.: se não tiver algum item, pode substituir..."></textarea></label>
    <button id="send" class="send" type="button">Finalizar pedido no WhatsApp →</button>
  </div>
</section>
</main>
<button id="floating-search" class="floating-search" type="button" aria-label="Buscar produto">⌕</button>
<div id="floating-search-box" class="floating-search-box" aria-hidden="true">
  <span>⌕</span><input id="floating-search-input" type="search" placeholder="O que você procura?" autocomplete="off"><button id="close-floating-search" type="button" aria-label="Fechar busca">×</button>
</div>
<button id="floating-checkout" class="floating-checkout" type="button" aria-label="Finalizar pedido">
  <span class="floating-cart">🛒<i id="floatcount">0</i></span>
  <span><b>Finalizar pedido</b><small>Ir para a sacola</small></span>
  <strong>→</strong>
</button>
<nav class="bottom"><button id="nav-home" type="button">⌂<span>Início</span></button><button id="nav-cats" type="button">▦<span>Categorias</span></button><button id="nav-bag" type="button">🛒<span>Sacola <em id="navcount">0</em></span></button><button id="nav-more" type="button">☰<span>Mais</span></button></nav>
<div id="modal" class="modal"><div class="shade"></div><div class="modalbox"><button id="close" type="button">×</button><small>ALTERAR ITEM</small><h3 id="mname"></h3><label>Unidade<select id="munit"></select></label><div class="mqty"><button id="mminus" type="button">−</button><input id="mqty" type="number" min="0"><button id="mplus" type="button">+</button></div><button id="msave" class="send" type="button">Salvar alteração</button></div></div>
<div id="category-sheet" class="category-sheet" aria-hidden="true">
  <div class="category-shade"></div>
  <div class="category-panel">
    <div class="category-panel-head">
      <div><small>CATEGORIAS</small><h3>O que você procura?</h3></div>
      <button id="close-categories" type="button" aria-label="Fechar categorias">×</button>
    </div>
    <div id="category-panel-list" class="category-panel-list"></div>
  </div>
</div>
<div id="toast"></div>
<script type="module" src="./preview.js?v=39"></script>
</body>
</html>
